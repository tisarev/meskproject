<!DOCTYPE html>
<html lang="ru">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" href="./favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="./favicon.ico" type="image/x-icon">

    <link href="./assets/css/normalize.css" rel="stylesheet" type="text/css">
    <link href="./assets/css/style.css?v=1.0" rel="stylesheet" type="text/css">

    <script src="./components/my-menu.js" defer></script>
    <script src="./components/my-footer.js" defer></script>

    <title>Изменить пароль</title>
</head>
<body>
    <div id="page">
        <my-menu></my-menu>
        <div id="page-content">
            <main>
                <h1>Изменить пароль</h1>
                <div class="content">
                    <div class="content-block">
                        <div class="content-block__wrapper" style="max-width: 900px;">

                            <div class="input-group">
                                <label for="old-p">Старый пароль</label>
                                <div class="input-wrapper">
                                    <input type="text" id="old-p" name="" >
                                </div>
                            </div>
                            
                            <fieldset>
                                <legend>Придумайте новый пароль</legend>
                            <div class="form-group">
                                <div class="input-group">
                                    <label for="new-p-1">Новый пароль</label>
                                    <div class="input-wrapper">
                                        <input type="text" id="new-p-1" >
                                    </div>
                                </div>
                                <div class="input-group ">
                                    <label for="new-p-2">Повторить пароль</label>
                                    <div class="input-wrapper">
                                        <input type="text" id="kpp" name="new-p-2">
                                    </div>
                                </div>
                            </div>
                            </fieldset>
                            
                            <button type="submit" class="btn-primary">Сохранить изменения</button>
                        </div>
                    </div>
                </div>
            </main>
            
            <my-footer></my-footer>
        </div>
    </div>
    <script src="./assets/js/main.js" defer></script>
</body>
</html>
